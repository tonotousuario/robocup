; OPcache para producción (mejor rendimiento de PHP)
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0          ; el código no cambia en runtime -> no revalidar
opcache.revalidate_freq=0
opcache.fast_shutdown=1

; Límites razonables para la app
upload_max_filesize=25M
post_max_size=27M
memory_limit=256M
